<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Accept Invitation</title>
    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}"/>
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center"
     style="min-height:100vh">
    <div class="card shadow-sm border-0" style="width:100%;max-width:440px">
        <div class="card-body p-4">

            <h4 class="mb-1">Set Up Your Account</h4>
            <p class="text-muted mb-4">
                You've been invited as
                <strong th:text="${role}">STAFF</strong>.
                Your login email will be
                <strong th:text="${email}">you@example.com</strong>.
            </p>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/staff/accept}" method="post">
                <input type="hidden" name="token" th:value="${token}"/>

                <div class="mb-3">
                    <label class="form-label">Full Name *</label>
                    <input type="text" name="username" class="form-control"
                           placeholder="Your name" required/>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password *</label>
                    <input type="password" name="password" class="form-control"
                           placeholder="Min 6 characters" required minlength="6"/>
                </div>

                <button class="btn btn-primary w-100" type="submit">
                    Create Account &amp; Log In
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
