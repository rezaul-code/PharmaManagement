<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Staff Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<!-- ══ Sidebar ══════════════════════════════════════════════════════════ -->
<div th:replace="~{fragments/sidebar :: sidebar(activePage='medicines')}"></div>

<!-- ══ MAIN ══════════════════════════════════════════════════════════ -->
<div class="main-wrapper">

    <div class="topbar">
        <div class="topbar-title">
            👥 Staff Management
            <small th:text="'Managing staff for: ' + ${pharmacyName}">Pharmacy</small>
        </div>
    </div>

    <div class="page-content">

        <!-- Flash messages -->
        <div th:if="${success}"
             style="padding:12px 16px;border-radius:8px;margin-bottom:16px;
                    background:#d1fae5;color:#065f46;border:1px solid #6ee7b7">
            ✅ <span th:text="${success}"></span>
        </div>
        <div th:if="${error}"
             style="padding:12px 16px;border-radius:8px;margin-bottom:16px;
                    background:#fee2e2;color:#991b1b;border:1px solid #fca5a5">
            ❌ <span th:text="${error}"></span>
        </div>

        <!-- ── Add Staff Form ──────────────────────────────────────── -->
        <div class="card" style="margin-bottom:20px">
            <div class="card-header">
                <div class="card-title">➕ Add New Staff Member</div>
                <!-- Slot limit indicators -->
                <div style="display:flex;gap:16px;font-size:12px;color:var(--text-muted)">
                    <span>
                        Pharmacist:
                        <strong th:if="${canAddPharmacist}"
                                style="color:var(--primary)">
                            Slot available
                        </strong>
                        <strong th:unless="${canAddPharmacist}"
                                style="color:#ef4444">
                            1/1 Full
                        </strong>
                    </span>
                    <span>
                        Staff:
                        <strong th:if="${canAddStaff}"
                                style="color:var(--primary)">
                            Slot available
                        </strong>
                        <strong th:unless="${canAddStaff}"
                                style="color:#ef4444">
                            2/2 Full
                        </strong>
                    </span>
                </div>
            </div>
            <div style="padding:20px">
                <form th:action="@{/staff/create}" method="post">
                    <div style="display:grid;
                                grid-template-columns:1fr 1fr 1fr 180px auto;
                                gap:16px;align-items:end">

                        <!-- Full Name -->
                        <div>
                            <label style="display:block;font-size:12px;font-weight:600;
                                          color:var(--text-muted);margin-bottom:6px">
                                FULL NAME *
                            </label>
                            <input type="text" name="username"
                                   style="width:100%;padding:10px 12px;border-radius:8px;
                                          border:1px solid var(--border);
                                          background:var(--input-bg);
                                          color:var(--text);font-size:14px"
                                   placeholder="Jane Doe" required/>
                        </div>

                        <!-- Email -->
                        <div>
                            <label style="display:block;font-size:12px;font-weight:600;
                                          color:var(--text-muted);margin-bottom:6px">
                                EMAIL *
                            </label>
                            <input type="email" name="email"
                                   style="width:100%;padding:10px 12px;border-radius:8px;
                                          border:1px solid var(--border);
                                          background:var(--input-bg);
                                          color:var(--text);font-size:14px"
                                   placeholder="staff@example.com" required/>
                        </div>

                        <!-- Password -->
                        <div>
                            <label style="display:block;font-size:12px;font-weight:600;
                                          color:var(--text-muted);margin-bottom:6px">
                                PASSWORD *
                            </label>
                            <input type="password" name="password"
                                   style="width:100%;padding:10px 12px;border-radius:8px;
                                          border:1px solid var(--border);
                                          background:var(--input-bg);
                                          color:var(--text);font-size:14px"
                                   placeholder="Min 6 characters"
                                   required minlength="6"/>
                        </div>

                        <!-- Role — options disabled when slot is full -->
                        <div>
                            <label style="display:block;font-size:12px;font-weight:600;
                                          color:var(--text-muted);margin-bottom:6px">
                                ROLE *
                            </label>
                            <select name="role"
                                    style="width:100%;padding:10px 12px;border-radius:8px;
                                           border:1px solid var(--border);
                                           background:var(--input-bg);
                                           color:var(--text);font-size:14px">
                                <option value="PHARMACIST"
                                        th:disabled="${!canAddPharmacist}"
                                        th:text="${canAddPharmacist} ? 'PHARMACIST' : 'PHARMACIST (full)'">
                                </option>
                                <option value="STAFF"
                                        th:disabled="${!canAddStaff}"
                                        th:text="${canAddStaff} ? 'STAFF' : 'STAFF (full)'">
                                </option>
                            </select>
                        </div>

                        <!-- Submit — disabled only when ALL slots are full -->
                        <div>
                            <button type="submit"
                                    th:disabled="${!canAddPharmacist and !canAddStaff}"
                                    style="padding:10px 28px;border-radius:8px;
                                           background:var(--primary);color:#fff;
                                           border:none;font-size:14px;font-weight:600;
                                           cursor:pointer;white-space:nowrap"
                                    th:style="${!canAddPharmacist and !canAddStaff}
                                              ? 'padding:10px 28px;border-radius:8px;background:#9ca3af;color:#fff;border:none;font-size:14px;font-weight:600;cursor:not-allowed;white-space:nowrap'
                                              : 'padding:10px 28px;border-radius:8px;background:var(--primary);color:#fff;border:none;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap'">
                                ➕ Create
                            </button>
                        </div>

                    </div>
                </form>
            </div>
        </div>

        <!-- ── Staff Table ─────────────────────────────────────────── -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">Current Staff</div>
                <span style="font-size:13px;color:var(--text-muted)"
                      th:text="${#lists.size(staffList)} + ' member(s)'">
                </span>
            </div>
            <div class="table-wrap">
                <table class="pharma-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Change Role</th>
                            <th class="num">Action</th>
                        </tr>
                    </thead>
                    <tbody>

                    <tr th:if="${#lists.isEmpty(staffList)}">
                        <td colspan="6"
                            style="text-align:center;padding:32px;color:var(--text-muted)">
                            No staff yet — add a member above.
                        </td>
                    </tr>

                    <tr th:each="member : ${staffList}">

                        <!-- Name + avatar -->
                        <td>
                            <div style="display:flex;align-items:center;gap:8px">
                                <div style="width:32px;height:32px;border-radius:50%;
                                            background:var(--primary);color:#fff;
                                            display:flex;align-items:center;
                                            justify-content:center;font-weight:700;
                                            font-size:13px;flex-shrink:0"
                                     th:text="${member.avatarInitial}">A</div>
                                <span th:text="${member.username}">Name</span>
                            </div>
                        </td>

                        <!-- Email -->
                        <td th:text="${member.email ?: '—'}">—</td>

                        <!-- Role badge -->
                        <td>
                            <span th:with="r=${member.role?.name()}"
                                  class="badge"
                                  th:classappend="${r == 'OWNER'} ? 'badge-danger' : (${r == 'PHARMACIST'} ? 'badge-info' : 'badge-muted')"
                                  th:text="${member.role}">STAFF</span>
                        </td>

                        <!-- Status -->
                        <td>
                            <span th:if="${member.status == 'ACTIVE'}"
                                  class="badge"
                                  style="background:rgba(52,211,153,.15);color:#34d399">
                                Active
                            </span>
                            <span th:if="${member.status == 'PENDING'}"
                                  class="badge"
                                  style="background:rgba(251,191,36,.15);color:#f59e0b">
                                Pending
                            </span>
                        </td>

                        <!-- Change Role -->
                        <td>
                            <form th:if="${!member.isOwner() and member.id != currentUser.id}"
                                  th:action="@{/staff/{id}/role(id=${member.id})}"
                                  method="post"
                                  style="display:flex;gap:8px;align-items:center">
                                <select name="role"
                                        style="padding:6px 10px;border-radius:6px;
                                               border:1px solid var(--border);
                                               background:var(--input-bg);
                                               color:var(--text);font-size:13px">
                                    <option th:each="r : ${roles}"
                                            th:value="${r}" th:text="${r}"
                                            th:selected="${r == member.role}">
                                    </option>
                                </select>
                                <button type="submit"
                                        style="padding:6px 12px;border-radius:6px;
                                               border:1px solid var(--primary);
                                               background:transparent;
                                               color:var(--primary);
                                               font-size:12px;cursor:pointer">
                                    Save
                                </button>
                            </form>
                            <span th:if="${member.isOwner() or member.id == currentUser.id}"
                                  style="color:var(--text-muted);font-size:13px">—</span>
                        </td>

                        <!-- Actions -->
                        <td class="num">
                            <div style="display:flex;gap:8px;justify-content:flex-end">

                                <!-- Approve PENDING -->
                                <form th:if="${member.status == 'PENDING'
                                              and member.id != currentUser.id}"
                                      th:action="@{/staff/{id}/approve(id=${member.id})}"
                                      method="post">
                                    <button type="submit"
                                            style="padding:6px 12px;border-radius:6px;
                                                   background:#34d399;color:#fff;
                                                   border:none;font-size:12px;cursor:pointer">
                                        ✅ Approve
                                    </button>
                                </form>

                                <!-- Remove -->
                                <form th:if="${member.id != currentUser.id}"
                                      th:action="@{/staff/{id}/delete(id=${member.id})}"
                                      method="post"
                                      onsubmit="return confirm('Remove this staff member?')">
                                    <button type="submit"
                                            style="padding:6px 12px;border-radius:6px;
                                                   border:1px solid #ef4444;
                                                   background:transparent;color:#ef4444;
                                                   font-size:12px;cursor:pointer">
                                        Remove
                                    </button>
                                </form>

                                <!-- You -->
                                <span th:if="${member.id == currentUser.id}"
                                      class="badge badge-muted">You</span>
                            </div>
                        </td>

                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

</body>
</html>
