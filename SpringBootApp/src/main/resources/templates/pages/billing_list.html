<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bill History — PharmaManagement</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>

<!-- ══ Sidebar ══════════════════════════════════════════════════════════ -->
<div th:replace="~{fragments/sidebar :: sidebar(activePage='medicines')}"></div>

<!-- ══ MAIN ══════════════════════════════════════════════════════════ -->
<div class="main-wrapper">
  <div class="topbar">
    <div class="topbar-title">
      Bill History
      <small>All billing records, most recent first</small>
    </div>
    <div class="topbar-actions">
      <a href="/billing/new" class="topbar-btn btn-primary">🧾 New Bill</a>
    </div>
  </div>

  <div class="page-content">
    <div class="card">
      <div class="card-header">
        <div class="card-title">📋 All Bills</div>
        <span style="font-size:12px;color:var(--text-muted)"
              th:text="${bills.size()} + ' record(s)'">0 records</span>
      </div>
      <div class="table-wrap">
        <table class="pharma-table">
          <thead>
            <tr>
              <th>Bill #</th>
              <th>Patient</th>
              <th>Phone</th>
              <th>Date</th>
              <th class="num">Subtotal</th>
              <th class="num">GST</th>
              <th class="num">Grand Total</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${#lists.isEmpty(bills)}">
              <td colspan="9" style="text-align:center;padding:40px;color:var(--text-muted)">
                No bills found. <a href="/billing/new" style="color:var(--primary);font-weight:600">Create the first one →</a>
              </td>
            </tr>
            <tr th:each="bill : ${bills}">
              <td>
                <a th:href="@{/billing/view/{id}(id=${bill.id})}"
                   th:text="${bill.billNumber}"
                   style="color:var(--primary);font-weight:700;font-family:var(--font-mono)">—</a>
              </td>
              <td th:text="${bill.patientName ?: 'Walk-in'}">—</td>
              <td style="color:var(--text-muted)" th:text="${bill.patientPhone ?: '—'}">—</td>
              <td style="color:var(--text-muted);font-size:12.5px"
                  th:text="${#temporals.format(bill.createdAt, 'dd MMM yyyy, hh:mm a')}">—</td>
              <td class="num">₹<span th:text="${#numbers.formatDecimal(bill.subtotal, 1, 2)}">0.00</span></td>
              <td class="num" style="color:var(--warning)">₹<span th:text="${#numbers.formatDecimal(bill.totalGst, 1, 2)}">0.00</span></td>
              <td class="num fw-bold text-primary">₹<span th:text="${#numbers.formatDecimal(bill.grandTotal, 1, 2)}">0.00</span></td>
              <td>
                <span class="badge"
                  th:classappend="${bill.status.name() == 'PAID' ? 'badge-success' : bill.status.name() == 'CANCELLED' ? 'badge-danger' : 'badge-warning'}"
                  th:text="${bill.status}">PAID</span>
              </td>
              <td>
                <a th:href="@{/billing/view/{id}(id=${bill.id})}"
                   class="btn btn-sm btn-outline"
                   style="border:1.5px solid var(--border);background:transparent;color:var(--text)">
                   👁 View
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>
</body>
</html>
