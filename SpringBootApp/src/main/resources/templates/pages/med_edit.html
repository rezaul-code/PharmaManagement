<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Medicine — PharmaManagement</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<!-- ══ Sidebar ══════════════════════════════════════════════════════════ -->
<div th:replace="~{fragments/sidebar :: sidebar(activePage='medicines')}"></div>

<!-- ══ MAIN ══════════════════════════════════════════════════════════════ -->
<div class="main-wrapper">
  <div class="topbar">
    <div class="topbar-title">
      Edit Medicine
      <small th:text="'Editing: ' + ${medicine.name}">Medicine</small>
    </div>
    <div class="topbar-actions">
      <a href="/medicine/show" class="topbar-btn btn-outline">← Back to List</a>
    </div>
  </div>

  <div class="page-content">
    <div style="max-width:820px;margin:0 auto">
      <div class="card">
        <div class="card-header">
          <div class="card-title">✏️ Edit Medicine Details</div>
        </div>
        <div class="card-body">

          <form th:action="@{/medicine/edit/{id}(id=${medicine.id})}" method="post"
                th:object="${medicine}">

            <!-- ── Medicine Code banner (immutable after creation) ── NEW ── -->
            <div style="background:linear-gradient(135deg,#f8fafc 0%,#f1f5f9 100%);
                        border:1.5px solid #e2e8f0;border-radius:10px;
                        padding:14px 18px;margin-bottom:24px;
                        display:flex;align-items:center;gap:14px">
              <div style="font-size:26px;line-height:1">🏷️</div>
              <div style="flex:1">
                <div style="font-size:11px;font-weight:700;color:#475569;
                            text-transform:uppercase;letter-spacing:.6px;
                            margin-bottom:4px">Medicine Code</div>
                <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">

                  <!-- Visible display of the code -->
                  <span style="font-family:var(--font-mono,monospace);
                               font-size:18px;font-weight:700;color:#1d4ed8;
                               background:#eff6ff;padding:4px 14px;
                               border-radius:8px;border:1.5px solid #bfdbfe;
                               letter-spacing:.5px"
                        th:text="${medicine.medicineCode ?: '—'}">MED-001</span>

                  <!-- Hidden field so it's submitted with the form -->
                  <input type="hidden"
                         th:field="*{medicineCode}" />

                  <span style="font-size:11px;color:#64748b;
                               background:#e2e8f0;padding:2px 8px;
                               border-radius:20px;font-weight:600;
                               white-space:nowrap">
                    🔒 Cannot be changed after creation
                  </span>
                </div>
              </div>
            </div>

            <!-- Row 1: Name + Type -->
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
              <div class="form-group">
                <label class="form-label">Medicine Name *</label>
                <input type="text" class="form-control"
                       th:field="*{name}" required />
              </div>
              <div class="form-group">
                <label class="form-label">Type</label>
                <select class="form-control" th:field="*{type}">
                  <option value="">— Select type —</option>
                  <option th:each="t : ${T(com.myspringboot.SpringBootApp.model.MedicineType).values()}"
                          th:value="${t}" th:text="${t}">TYPE</option>
                </select>
              </div>
            </div>

            <!-- Row 2: Manufacturer + Batch No -->
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
              <div class="form-group">
                <label class="form-label">Manufacturer</label>
                <input type="text" class="form-control"
                       th:field="*{manufacturer}" />
              </div>
              <div class="form-group">
                <label class="form-label">Batch No</label>
                <input type="text" class="form-control"
                       th:field="*{batchNo}" />
              </div>
            </div>

            <!-- Row 3: Price + GST + Stock -->
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px">
              <div class="form-group">
                <label class="form-label">Unit Price (₹) *</label>
                <input type="number" class="form-control"
                       th:field="*{price}" required step="0.01" min="0" />
              </div>
              <div class="form-group">
                <label class="form-label">GST Percentage (%)</label>
                <select class="form-control" th:field="*{gstPercentage}">
                  <option value="0">0% (Exempt)</option>
                  <option value="5">5%</option>
                  <option value="12">12%</option>
                  <option value="18">18%</option>
                  <option value="28">28%</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Stock Quantity *</label>
                <input type="number" class="form-control"
                       th:field="*{stockQuantity}" required min="0" />
              </div>
            </div>

            <!-- Row 4: Expiry + Description -->
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
              <div class="form-group">
                <label class="form-label">Expiry Date</label>
                <input type="month" class="form-control"
                       th:field="*{expiryDate}" />
              </div>
              <div class="form-group">
                <label class="form-label">Description</label>
                <input type="text" class="form-control"
                       th:field="*{description}" />
              </div>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary btn-lg">💾 Update Medicine</button>
              <a href="/medicine/show" class="btn btn-secondary btn-lg">Cancel</a>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
