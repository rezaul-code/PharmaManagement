<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Medicine — PharmaManagement</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<!-- ══ SIDEBAR ══════════════════════════════════════════════════════ -->
<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="brand-icon">💊</div>
    <div class="brand-text">
      <span class="brand-name">PharmaManage</span>
      <span class="brand-sub">v2.0 Pro</span>
    </div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section-label">Main</div>
    <a href="/dashboard" class="nav-item"><span class="nav-icon">🏠</span> Dashboard</a>
    <div class="nav-section-label">Medicine</div>
    <a href="/medicine/show" class="nav-item active"><span class="nav-icon">💊</span> All Medicines</a>
    <a href="/medicine/add"  class="nav-item"><span class="nav-icon">➕</span> Add Medicine</a>
    <div class="nav-section-label">Billing</div>
    <a href="/billing/new"  class="nav-item"><span class="nav-icon">🧾</span> New Bill</a>
    <a href="/billing/list" class="nav-item"><span class="nav-icon">📋</span> Bill History</a>
  </nav>
  <div class="sidebar-footer">
    <div class="sidebar-user">
      <div class="avatar">A</div>
      <div class="user-info">
        <div class="user-name" th:text="${session.loggedInUser?.username ?: 'Admin'}">Admin</div>
        <div class="user-role">Pharmacist</div>
      </div>
    </div>
    <a href="/logout" style="display:block;margin-top:10px;padding:8px 12px;border-radius:8px;color:#94a3b8;font-size:13px;">🚪 Sign Out</a>
  </div>
</aside>

<!-- ══ MAIN ══════════════════════════════════════════════════════════ -->
<div class="main-wrapper">
  <div class="topbar">
    <div class="topbar-title">
      Edit Medicine
      <small th:text="'Editing: ' + ${medicine.name}">Medicine</small>
    </div>
    <div class="topbar-actions">
      <a href="/medicine/show" class="topbar-btn btn-outline">← Back to List</a>
    </div>
  </div>

  <div class="page-content">
    <div style="max-width:760px;margin:0 auto">
      <div class="card">
        <div class="card-header">
          <div class="card-title">✏️ Edit Medicine Details</div>
        </div>
        <div class="card-body">

          <form th:action="@{/medicine/edit/{id}(id=${medicine.id})}" method="post"
                th:object="${medicine}">

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
              <div class="form-group">
                <label class="form-label">Medicine Name *</label>
                <input type="text" class="form-control" th:field="*{name}" required />
              </div>
              <div class="form-group">
                <label class="form-label">Type</label>
                <select class="form-control" th:field="*{type}">
                  <option value="">— Select type —</option>
                  <option th:each="t : ${T(com.myspringboot.SpringBootApp.model.MedicineType).values()}"
                          th:value="${t}" th:text="${t}">TYPE</option>
                </select>
              </div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
              <div class="form-group">
                <label class="form-label">Manufacturer</label>
                <input type="text" class="form-control" th:field="*{manufacturer}" />
              </div>
              <div class="form-group">
                <label class="form-label">Batch No</label>
                <input type="text" class="form-control" th:field="*{batchNo}" />
              </div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px">
              <div class="form-group">
                <label class="form-label">Unit Price (₹) *</label>
                <input type="number" class="form-control"
                       th:field="*{price}" required step="0.01" min="0" />
              </div>
              <div class="form-group">
                <label class="form-label">GST Percentage (%)</label>
                <select class="form-control" th:field="*{gstPercentage}">
                  <option value="0">0% (Exempt)</option>
                  <option value="5">5%</option>
                  <option value="12">12%</option>
                  <option value="18">18%</option>
                  <option value="28">28%</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Stock Quantity *</label>
                <input type="number" class="form-control"
                       th:field="*{stockQuantity}" required min="0" />
              </div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
              <div class="form-group">
                <label class="form-label">Expiry Date</label>
                <input type="month" class="form-control" th:field="*{expiryDate}" />
              </div>
              <div class="form-group">
                <label class="form-label">Description</label>
                <input type="text" class="form-control" th:field="*{description}" />
              </div>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary btn-lg">💾 Update Medicine</button>
              <a href="/medicine/show" class="btn btn-secondary btn-lg">Cancel</a>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
