<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Medicine — PharmaManagement</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<!-- ══ Sidebar ══════════════════════════════════════════════════════════ -->
<div th:replace="~{fragments/sidebar :: sidebar(activePage='medicines')}"></div>

<!-- ══ MAIN ══════════════════════════════════════════════════════════ -->
<div class="main-wrapper">
  <div class="topbar">
    <div class="topbar-title">
      Edit Medicine
      <small th:text="'Editing: ' + ${medicine.name}">Medicine</small>
    </div>
    <div class="topbar-actions">
      <a href="/medicine/show" class="topbar-btn btn-outline">← Back to List</a>
    </div>
  </div>

  <div class="page-content">
    <div style="max-width:760px;margin:0 auto">
      <div class="card">
        <div class="card-header">
          <div class="card-title">✏️ Edit Medicine Details</div>
        </div>
        <div class="card-body">

          <form th:action="@{/medicine/edit/{id}(id=${medicine.id})}" method="post"
                th:object="${medicine}">

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
              <div class="form-group">
                <label class="form-label">Medicine Name *</label>
                <input type="text" class="form-control" th:field="*{name}" required />
              </div>
              <div class="form-group">
                <label class="form-label">Type</label>
                <select class="form-control" th:field="*{type}">
                  <option value="">— Select type —</option>
                  <option th:each="t : ${T(com.myspringboot.SpringBootApp.model.MedicineType).values()}"
                          th:value="${t}" th:text="${t}">TYPE</option>
                </select>
              </div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
              <div class="form-group">
                <label class="form-label">Manufacturer</label>
                <input type="text" class="form-control" th:field="*{manufacturer}" />
              </div>
              <div class="form-group">
                <label class="form-label">Batch No</label>
                <input type="text" class="form-control" th:field="*{batchNo}" />
              </div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px">
              <div class="form-group">
                <label class="form-label">Unit Price (₹) *</label>
                <input type="number" class="form-control"
                       th:field="*{price}" required step="0.01" min="0" />
              </div>
              <div class="form-group">
                <label class="form-label">GST Percentage (%)</label>
                <select class="form-control" th:field="*{gstPercentage}">
                  <option value="0">0% (Exempt)</option>
                  <option value="5">5%</option>
                  <option value="12">12%</option>
                  <option value="18">18%</option>
                  <option value="28">28%</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Stock Quantity *</label>
                <input type="number" class="form-control"
                       th:field="*{stockQuantity}" required min="0" />
              </div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
              <div class="form-group">
                <label class="form-label">Expiry Date</label>
                <input type="month" class="form-control" th:field="*{expiryDate}" />
              </div>
              <div class="form-group">
                <label class="form-label">Description</label>
                <input type="text" class="form-control" th:field="*{description}" />
              </div>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary btn-lg">💾 Update Medicine</button>
              <a href="/medicine/show" class="btn btn-secondary btn-lg">Cancel</a>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
