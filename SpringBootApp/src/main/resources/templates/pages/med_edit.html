<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Medicine — PharmaManagement</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="main-wrapper">
  <div class="topbar">
    <div class="topbar-title">
      Edit Medicine
      <small th:text="'Editing: ' + ${medicine.name}">Medicine</small>
    </div>
    <div class="topbar-actions">
      <a href="/medicine/show" class="topbar-btn btn-outline">← Back to List</a>
    </div>
  </div>

  <div class="page-content">
    <div style="max-width:840px;margin:0 auto">
      <div class="card">
        <div class="card-header">
          <div class="card-title">✏️ Edit Medicine Details</div>
        </div>
        <div class="card-body">

          <form th:action="@{/medicine/edit/{id}(id=${medicine.id})}" method="post"
                th:object="${medicine}">

            <!-- ── Medicine Code (immutable) ──────────────────────────── -->
            <div style="background:linear-gradient(135deg,#f8fafc,#f1f5f9);
                        border:1.5px solid #e2e8f0;border-radius:10px;
                        padding:14px 18px;margin-bottom:24px;
                        display:flex;align-items:center;gap:14px">
              <div style="font-size:26px">🏷️</div>
              <div style="flex:1">
                <div style="font-size:11px;font-weight:700;color:#475569;
                            text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px">
                  Medicine Code
                </div>
                <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
                  <span style="font-family:var(--font-mono,monospace);font-size:18px;
                               font-weight:700;color:#1d4ed8;background:#eff6ff;
                               padding:4px 14px;border-radius:8px;
                               border:1.5px solid #bfdbfe;letter-spacing:.5px"
                        th:text="${medicine.medicineCode ?: '—'}">MED-001</span>
                  <input type="hidden" th:field="*{medicineCode}" />
                  <span style="font-size:11px;color:#64748b;background:#e2e8f0;
                               padding:2px 8px;border-radius:20px;font-weight:600">
                    🔒 Cannot be changed
                  </span>
                </div>
              </div>
            </div>

            <!-- ── Row 1: Name + Type ─────────────────────────────────── -->
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
              <div class="form-group">
                <label class="form-label">Medicine Name *</label>
                <input type="text" class="form-control" th:field="*{name}" required />
              </div>
              <div class="form-group">
                <label class="form-label">Type</label>
                <select class="form-control" th:field="*{type}">
                  <option value="">— Select type —</option>
                  <option th:each="t : ${T(com.myspringboot.SpringBootApp.model.MedicineType).values()}"
                          th:value="${t}" th:text="${t}">TYPE</option>
                </select>
              </div>
            </div>

            <!-- ── Row 2: Manufacturer + Batch No ────────────────────── -->
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
              <div class="form-group">
                <label class="form-label">Manufacturer</label>
                <input type="text" class="form-control" th:field="*{manufacturer}" />
              </div>
              <div class="form-group">
                <label class="form-label">Batch No</label>
                <input type="text" class="form-control" th:field="*{batchNo}" />
              </div>
            </div>

            <!-- ── Row 3: Purchase Price + Selling Price ──────────────── -->
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
              <div class="form-group">
                <label class="form-label">
                  Purchase Price (₹)
                  <span style="font-size:10px;color:#64748b;font-weight:400">
                    — What you pay the supplier
                  </span>
                </label>
                <input type="number" class="form-control" th:field="*{purchasePrice}"
                       id="purchasePrice"
                       step="0.01" min="0" placeholder="0.00"
                       oninput="updateProfitPreview()" />
              </div>
              <div class="form-group">
                <label class="form-label">
                  Selling Price (₹) *
                  <span style="font-size:10px;color:#64748b;font-weight:400">
                    — What you charge customers
                  </span>
                </label>
                <input type="number" class="form-control" th:field="*{price}"
                       id="sellingPrice"
                       required step="0.01" min="0"
                       oninput="updateProfitPreview(); updateGstPreview()" />
              </div>
            </div>

            <!-- ── Profit Preview ─────────────────────────────────────── -->
            <div id="profitPreviewBox"
                 style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;
                        padding:12px 18px;margin-bottom:20px;font-size:13px;
                        display:flex;gap:28px;flex-wrap:wrap;align-items:center">
              <span style="font-weight:700;color:#166534">💰 Profit Preview</span>
              <span style="color:#166534">
                Profit per unit:
                <strong id="profitAmt" style="font-family:monospace">₹0.00</strong>
              </span>
              <span style="color:#166534">
                Margin:
                <strong id="profitPct" style="font-family:monospace">0.00%</strong>
              </span>
              <span id="negativeWarning"
                    style="display:none;color:#dc2626;font-weight:700">
                ⚠️ Selling below purchase price!
              </span>
            </div>

            <!-- ── Row 4: GST + Stock ─────────────────────────────────── -->
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
              <div class="form-group">
                <label class="form-label">GST Percentage (%)</label>
                <select class="form-control" th:field="*{gstPercentage}"
                        onchange="updateGstPreview()">
                  <option value="0">0% (Exempt)</option>
                  <option value="5">5%</option>
                  <option value="12">12%</option>
                  <option value="18">18%</option>
                  <option value="28">28%</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Stock Quantity *</label>
                <input type="number" class="form-control" th:field="*{stockQuantity}"
                       required min="0" />
              </div>
            </div>

            <!-- ── Row 5: Expiry + Description ───────────────────────── -->
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
              <div class="form-group">
                <label class="form-label">Expiry Date</label>
                <input type="month" class="form-control" th:field="*{expiryDate}" />
              </div>
              <div class="form-group">
                <label class="form-label">Description</label>
                <input type="text" class="form-control" th:field="*{description}" />
              </div>
            </div>

            <!-- ── GST Preview ────────────────────────────────────────── -->
            <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;
                        padding:14px 18px;margin-bottom:20px;font-size:13px">
              <strong style="color:#166534">💡 GST Preview</strong>
              <span style="color:#166534;margin-left:8px">
                Selling ₹<span id="previewPrice">0.00</span>
                + <span id="previewGstPct">0</span>% GST →
                GST = ₹<span id="previewGstAmt">0.00</span>,
                Final = ₹<span id="previewFinal">0.00</span>
              </span>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary btn-lg">💾 Update Medicine</button>
              <a href="/medicine/show" class="btn btn-secondary btn-lg">Cancel</a>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function updateProfitPreview() {
  var purchase = parseFloat(document.getElementById('purchasePrice')?.value) || 0;
  var selling  = parseFloat(document.getElementById('sellingPrice')?.value)  || 0;
  var profit   = selling - purchase;
  var pct      = purchase > 0 ? (profit / purchase * 100) : 0;

  document.getElementById('profitAmt').textContent =
    (profit >= 0 ? '' : '-') + '₹' + Math.abs(profit).toFixed(2);
  document.getElementById('profitPct').textContent = pct.toFixed(2) + '%';

  var warn = document.getElementById('negativeWarning');
  var box  = document.getElementById('profitPreviewBox');
  if (purchase > 0 && profit < 0) {
    warn.style.display = 'inline';
    box.style.background  = '#fef2f2';
    box.style.borderColor = '#fecaca';
    document.getElementById('profitAmt').style.color = '#dc2626';
    document.getElementById('profitPct').style.color = '#dc2626';
  } else {
    warn.style.display = 'none';
    box.style.background  = '#f0fdf4';
    box.style.borderColor = '#bbf7d0';
    document.getElementById('profitAmt').style.color = '#15803d';
    document.getElementById('profitPct').style.color = '#15803d';
  }
}

function updateGstPreview() {
  var price  = parseFloat(document.getElementById('sellingPrice')?.value) || 0;
  var gstPct = parseFloat(document.querySelector('[name="gstPercentage"]')?.value) || 0;
  var gstAmt = price * gstPct / 100;
  var final_ = price + gstAmt;

  document.getElementById('previewPrice').textContent  = price.toFixed(2);
  document.getElementById('previewGstPct').textContent = gstPct;
  document.getElementById('previewGstAmt').textContent = gstAmt.toFixed(2);
  document.getElementById('previewFinal').textContent  = final_.toFixed(2);
}

// Run on page load so existing values are reflected immediately
document.addEventListener('DOMContentLoaded', function () {
  updateProfitPreview();
  updateGstPreview();
});
</script>
</body>
</html>
