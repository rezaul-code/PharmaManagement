<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sign Up — SpringPharma</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --teal-dark:   #0d2d2a;
            --teal-accent: #1a9e8f;
            --teal-bright: #22c9b5;
            --text-light:  #e8f5f3;
            --text-muted:  #7ab8b0;
            --glass-bg:    rgba(255,255,255,0.06);
            --glass-border:rgba(255,255,255,0.12);
        }

        html, body {
            height: 100%; width: 100%;
            font-family: 'DM Sans', sans-serif;
            background: var(--teal-dark);
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed; inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 10% 20%, rgba(26,158,143,0.18) 0%, transparent 60%),
                radial-gradient(ellipse 60% 80% at 90% 80%, rgba(34,201,181,0.12) 0%, transparent 55%);
            pointer-events: none;
        }

        .page {
            height: 100vh; width: 100vw;
            display: flex; align-items: center; justify-content: center;
            padding: 1rem;
        }

        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 1.8rem 2.2rem;
            width: 100%; max-width: 680px;
            animation: fadeUp 0.5s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Brand ── */
        .brand {
            display: flex; align-items: center; gap: 0.65rem;
            margin-bottom: 1.2rem;
        }
        .brand-icon {
            width: 38px; height: 38px; border-radius: 10px;
            background: linear-gradient(135deg, var(--teal-accent), var(--teal-bright));
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem;
        }
        .brand-text h1 { font-family: 'Syne', sans-serif; font-size: 1.05rem; font-weight: 800; color: var(--text-light); }
        .brand-text p  { font-size: 0.65rem; color: var(--text-muted); letter-spacing: 0.08em; }

        .heading { margin-bottom: 1.2rem; }
        .heading h2 { font-family: 'Syne', sans-serif; font-size: 1.35rem; font-weight: 700; color: var(--text-light); }
        .heading p  { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }

        /* ── Two-column grid ── */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 1.4rem;
        }
        .full { grid-column: 1 / -1; }

        /* ── Section divider ── */
        .section-label {
            grid-column: 1 / -1;
            font-size: 0.65rem; font-weight: 700;
            letter-spacing: 0.1em; text-transform: uppercase;
            color: var(--teal-bright);
            border-bottom: 1px solid rgba(34,201,181,0.25);
            padding-bottom: 4px; margin-bottom: 0.1rem; margin-top: 0.6rem;
        }

        /* ── Fields ── */
        .field { margin-bottom: 0.7rem; }
        label {
            display: block; font-size: 0.68rem; font-weight: 500;
            letter-spacing: 0.06em; text-transform: uppercase;
            color: var(--text-muted); margin-bottom: 4px;
        }
        input[type=text], input[type=email], input[type=password], input[type=tel] {
            width: 100%; padding: 0.55rem 0.85rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            border-radius: 9px; color: var(--text-light);
            font-family: 'DM Sans', sans-serif; font-size: 0.85rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input::placeholder { color: rgba(122,184,176,0.45); font-size: 0.8rem; }
        input:focus {
            outline: none;
            border-color: var(--teal-bright);
            box-shadow: 0 0 0 3px rgba(34,201,181,0.12);
        }

        /* ── Alert ── */
        .alert {
            grid-column: 1 / -1;
            background: rgba(220,60,60,0.15);
            border: 1px solid rgba(220,60,60,0.3);
            color: #ff9090; border-radius: 9px;
            padding: 0.55rem 0.85rem; font-size: 0.8rem;
            margin-bottom: 0.4rem;
        }

        /* ── Submit ── */
        .btn-submit {
            grid-column: 1 / -1;
            width: 100%; padding: 0.7rem;
            background: linear-gradient(135deg, var(--teal-accent), var(--teal-bright));
            color: #fff; font-family: 'Syne', sans-serif;
            font-size: 0.9rem; font-weight: 700;
            border: none; border-radius: 11px; cursor: pointer;
            margin-top: 0.4rem;
            box-shadow: 0 4px 18px rgba(34,201,181,0.25);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(34,201,181,0.4); }

        /* ── Footer ── */
        .footer-link {
            grid-column: 1 / -1;
            text-align: center; margin-top: 0.75rem;
            font-size: 0.8rem; color: var(--text-muted);
        }
        .footer-link a { color: var(--teal-bright); font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
<div class="page">
  <div class="card">

    <div class="brand">
      <div class="brand-icon">💊</div>
      <div class="brand-text">
        <h1>SpringPharma</h1>
        <p>MANAGEMENT SYSTEM</p>
      </div>
    </div>

    <div class="heading">
      <h2>Create your pharmacy</h2>
      <p>Register your pharmacy and owner account in one step</p>
    </div>

    <form th:action="@{/signup}" method="post" th:object="${user}">
      <div class="grid">

        <!-- Error -->
        <div class="alert" th:if="${error}" th:text="${error}"></div>

        <!-- ── PHARMACY ── -->
        <div class="section-label">🏥 Pharmacy Details</div>

        <div class="field full">
          <label>Pharmacy Name *</label>
          <input type="text" name="pharmacyName" placeholder="e.g. City Pharmacy" required/>
        </div>
        <div class="field">
          <label>Address</label>
          <input type="text" name="pharmacyAddress" placeholder="Street, City"/>
        </div>
        <div class="field">
          <label>License Number</label>
          <input type="text" name="pharmacyLicense" placeholder="LIC-2024-001"/>
        </div>
        <div class="field">
          <label>Pharmacy Phone</label>
          <input type="tel" name="pharmacyPhone" placeholder="9876543210"/>
        </div>
        <div class="field">
          <label>Pharmacy Email</label>
          <input type="email" name="pharmacyEmail" placeholder="contact@pharmacy.com"/>
        </div>

        <!-- ── OWNER ACCOUNT ── -->
        <div class="section-label">👤 Owner Account</div>

        <div class="field">
          <label>Full Name *</label>
          <input type="text" th:field="*{username}" placeholder="Your full name" required/>
        </div>
        <div class="field">
          <label>Password *</label>
          <input type="password" th:field="*{password}" placeholder="Create a password" required/>
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" th:field="*{email}" placeholder="your@email.com"/>
        </div>
        <div class="field">
          <label>Phone</label>
          <input type="tel" th:field="*{phone}" placeholder="10-digit mobile"/>
        </div>

        <button type="submit" class="btn-submit">Create Pharmacy &amp; Account →</button>

        <div class="footer-link">
          Already registered? <a th:href="@{/login}">Sign in here</a>
        </div>

      </div>
    </form>

  </div>
</div>
</body>
</html>
