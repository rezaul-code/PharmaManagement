<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up — PharmaManagement</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">
      <div class="logo-icon">💊</div>
      <div class="logo-title">Create Account</div>
      <div class="logo-sub">PharmaManage — Professional Pharmacy System</div>
    </div>

    <div th:if="${error}" class="alert alert-danger">
      ⚠️ <span th:text="${error}">Error</span>
    </div>

    <form th:action="@{/signup}" method="post" th:object="${user}">

      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-control"
               th:field="*{username}" placeholder="Your name" required />
      </div>

      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-control"
               th:field="*{email}" placeholder="you@pharmacy.com" required />
      </div>

      <div class="form-group">
        <label class="form-label">Phone Number</label>
        <input type="tel" class="form-control"
               th:field="*{phone}" placeholder="+91 00000 00000" />
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-control"
               th:field="*{password}" placeholder="Enter password" required />
      </div>

      <button type="submit" class="btn btn-primary btn-lg"
              style="width:100%;justify-content:center;margin-top:8px">
        ✅ Create Account
      </button>

    </form>

    <div class="auth-footer-text">
      Already have an account? <a th:href="@{/login}">Sign in</a>
    </div>

  </div>
</div>

</body>
</html>
