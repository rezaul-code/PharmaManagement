<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ══ REUSABLE SIDEBAR FRAGMENT ══════════════════════════════════════
     Usage: <div th:replace="~{fragments/sidebar :: sidebar}"></div>
     Set activePage in your controller:
       model.addAttribute("activePage", "dashboard");
     activePage values:
       dashboard | medicines | add-medicine | new-bill | bill-history |
       sales-analytics | inventory-analytics | monthly-trends |
       staff | settings
═══════════════════════════════════════════════════════════════════════ -->
<aside class="sidebar" th:fragment="sidebar">

  <!-- Brand -->
  <div class="sidebar-brand">
    <div class="brand-icon">💊</div>
    <div class="brand-text">
      <span class="brand-name">PharmaManage</span>
      <span class="brand-sub">v2.0 Pro</span>
    </div>
  </div>

  <!-- Nav -->
  <nav class="sidebar-nav">

    <a href="/dashboard"
       th:classappend="${activePage == 'dashboard'} ? ' active' : ''"
       class="nav-item">
      <span class="nav-icon">🏠</span> Dashboard
    </a>

    <a href="/medicine/show"
       th:classappend="${activePage == 'medicines'} ? ' active' : ''"
       class="nav-item">
      <span class="nav-icon">💊</span> All Medicines
    </a>

    <th:block th:if="${session.loggedInUser?.canManageMedicines()}">
      <a href="/medicine/add"
         th:classappend="${activePage == 'add-medicine'} ? ' active' : ''"
         class="nav-item">
        <span class="nav-icon">➕</span> Add Medicine
      </a>
    </th:block>

    <a href="/billing/new"
       th:classappend="${activePage == 'new-bill'} ? ' active' : ''"
       class="nav-item">
      <span class="nav-icon">🧾</span> New Bill
    </a>

    <a href="/billing/list"
       th:classappend="${activePage == 'bill-history'} ? ' active' : ''"
       class="nav-item">
      <span class="nav-icon">📋</span> Bill History
    </a>

    <a href="/sales-analytics"
       th:classappend="${activePage == 'sales-analytics'} ? ' active' : ''"
       class="nav-item">
      <span class="nav-icon">📊</span> Sales Analytics
    </a>

    <a href="/inventory-analytics"
       th:classappend="${activePage == 'inventory-analytics'} ? ' active' : ''"
       class="nav-item">
      <span class="nav-icon">📦</span> Inventory Analytics
    </a>

    <a href="/monthly-trends"
       th:classappend="${activePage == 'monthly-trends'} ? ' active' : ''"
       class="nav-item">
      <span class="nav-icon">📅</span> Monthly Trends
    </a>

    <th:block th:if="${session.loggedInUser?.isOwner()}">
      <a href="/staff"
         th:classappend="${activePage == 'staff'} ? ' active' : ''"
         class="nav-item">
        <span class="nav-icon">👥</span> Manage Staff
      </a>

      <a href="/pharmacy/settings"
         th:classappend="${activePage == 'settings'} ? ' active' : ''"
         class="nav-item">
        <span class="nav-icon">⚙️</span> Pharmacy Settings
      </a>
    </th:block>

  </nav>

  <!-- Footer -->
  <div class="sidebar-footer">

    <div class="sidebar-user" id="pharmacyTrigger" title="View pharmacy details"
         style="cursor:pointer;border-radius:10px;padding:6px 8px;margin:-6px -8px;transition:background .18s;"
         onmouseover="this.style.background='rgba(255,255,255,.06)'"
         onmouseout="this.style.background='transparent'">
      <div style="display:flex;align-items:center;gap:10px;">

        <div class="avatar"
             th:text="${session.loggedInUser?.avatarInitial ?: 'A'}">A</div>

        <div class="user-info">
          <div class="user-name"
               th:text="${session.loggedInUser?.username ?: 'Admin'}">Admin</div>

          <span th:with="r=${session.loggedInUser?.role?.name()}"
                class="role-badge"
                th:classappend="${r == 'OWNER' ? 'role-owner' : (r == 'PHARMACIST' ? 'role-pharmacist' : 'role-staff')}"
                th:text="${session.loggedInUser?.role ?: 'STAFF'}">STAFF</span>
        </div>

        <span style="margin-left:auto;font-size:14px;color:#475569;">›</span>
      </div>
      <div style="font-size:10px;color:#475569;margin-top:3px;padding-left:2px;">
        Click for pharmacy info
      </div>
    </div>

    <a href="/logout"
       style="display:block;margin-top:10px;padding:8px 12px;border-radius:8px;
              color:#94a3b8;font-size:13px;transition:.18s ease;"
       onmouseover="this.style.background='rgba(255,255,255,.06)'"
       onmouseout="this.style.background='transparent'">
      🚪 Sign Out
    </a>
  </div>

</aside>
</body>
</html>
